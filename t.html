<!DOCTYPE html>
<html>
<body>
<button onclick="test()">点我测试</button>
<script>
function test() {
  alert('按钮能点到，权限是：' + Notification.permission);
  if (Notification.permission === 'granted') {
    new Notification('成功', {body: '通知弹出来了！'});
  } else {
    Notification.requestPermission().then(p => {
      alert('权限变成了：' + p);
      if (p === 'granted') {
        new Notification('成功', {body: '通知弹出来了！'});
      }
    });
  }
}
</script>
</body>
</html>
